<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jo-Talks - Realtime Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex font-sans overflow-hidden">

    <!-- Sidebar: Users & Directory -->
    <div class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center">
            <div>
                <h1 class="font-bold text-indigo-400">Jo-Talks</h1>
                <p id="user-display" class="text-xs text-slate-400">Loading profile...</p>
            </div>
            <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition text-slate-300">Sign Out</button>
        </div>
        
        <div class="p-3 border-b border-slate-800">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Find User</h2>
            <input type="text" id="search-users" placeholder="Search by username..." onkeyup="filterUsers()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 text-white">
        </div>

        <div id="users-list" class="flex-1 overflow-y-auto p-2 space-y-1">
            <!-- Dynamic users list -->
        </div>
    </div>

    <!-- Main Chat Window -->
    <div class="flex-1 flex flex-col bg-slate-950 relative">
        <!-- Chat Header -->
        <div id="chat-header" class="p-4 bg-slate-900/50 border-b border-slate-800 flex items-center justify-between">
            <span class="text-sm font-medium text-slate-400">Select a user from the directory to start talking</span>
        </div>

        <!-- Video Call Overlay Container -->
        <div id="video-container" class="hidden absolute inset-0 z-50 bg-slate-950/95 flex flex-col p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-indigo-400">Video Call</h2>
                <button onclick="endVideoCall()" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-lg text-xs font-semibold transition">End Call</button>
            </div>
            <div class="flex-1 grid grid-cols-2 gap-4 h-full">
                <div class="bg-slate-900 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center relative">
                    <span class="absolute bottom-3 left-3 text-xs bg-black/50 px-2 py-1 rounded">You</span>
                    <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                </div>
                <div class="bg-slate-900 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center relative">
                    <span class="absolute bottom-3 left-3 text-xs bg-black/50 px-2 py-1 rounded">Remote User</span>
                    <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                </div>
            </div>
        </div>

        <!-- Messages Container -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4 flex flex-col">
            <div class="m-auto text-center text-slate-600 text-sm">
                No conversation selected.
            </div>
        </div>

        <!-- Message & Media Input Form -->
        <form id="message-form" onsubmit="sendMessage(event)" class="p-4 bg-slate-900 border-t border-slate-800 hidden flex items-center gap-2">
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg transition text-slate-300 flex items-center justify-center" title="Send Picture">
                📷
                <input type="file" id="media-input" accept="image/*" onchange="sendImage(event)" class="hidden">
            </label>
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2.5 rounded-lg text-sm font-semibold transition shadow-lg shadow-indigo-600/20">Send</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://vjmdwaaopgejmlxwckee.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqbWR3YWFvcGdlam1seHdja2VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNjIxMzYsImV4cCI6MjEwNjgzODEzNn0.cZ88A9696y8h_edO8tLMgQcQWhhWk1ScRCfptx1bU9A';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let activeRecipient = null;
        let allProfiles = [];
        let messageSubscription = null;
        let localStream = null;

        async function init() {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;

            const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
            if (profile) {
                document.getElementById('user-display').innerText = `@${profile.username || user.email.split('@')[0]}`;
            }

            await loadUsers();
        }

        async function loadUsers() {
            const { data, error } = await supabase.from('profiles').select('*').neq('id', currentUser.id);
            if (!error && data) {
                allProfiles = data;
                renderUsers(allProfiles);
            }
        }

        function renderUsers(users) {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = `p-3 rounded-lg cursor-pointer transition flex items-center justify-between hover:bg-slate-800 ${activeRecipient?.id === u.id ? 'bg-slate-800 border border-indigo-500/30' : ''}`;
                div.innerHTML = `
                    <div>
                        <p class="text-sm font-medium text-slate-200">@${u.username || 'user'}</p>
                        <p class="text-[10px] text-slate-500">Click to chat & call</p>
                    </div>
                `;
                div.onclick = () => selectRecipient(u);
                list.appendChild(div);
            });
        }

        function filterUsers() {
            const query = document.getElementById('search-users').value.toLowerCase();
            const filtered = allProfiles.filter(u => (u.username || '').toLowerCase().includes(query));
            renderUsers(filtered);
        }

        async function selectRecipient(recipient) {
            activeRecipient = recipient;
            renderUsers(allProfiles);

            document.getElementById('chat-header').innerHTML = `
                <div class="flex items-center gap-3">
                    <h2 class="text-sm font-semibold text-white">@${recipient.username}</h2>
                </div>
                <button onclick="startVideoCall()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1">📹 Video Call</button>
            `;
            document.getElementById('message-form').classList.remove('hidden');

            await loadMessages();
            setupRealtimeSubscription();
        }

        async function loadMessages() {
            const { data } = await supabase
                .from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeRecipient.id}),and(sender_id.eq.${activeRecipient.id},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });

            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(msg => appendMessageToDOM(msg));
            } else {
                container.innerHTML = '<div class="m-auto text-center text-slate-600 text-sm">No messages yet. Start the conversation!</div>';
            }
            container.scrollTop = container.scrollHeight;
        }

        function appendMessageToDOM(msg) {
            const container = document.getElementById('messages-container');
            if (container.querySelector('.text-slate-600')) container.innerHTML = '';

            const isMe = msg.sender_id === currentUser.id;
            const bubble = document.createElement('div');
            bubble.className = `max-w-xs md:max-w-md p-3 rounded-xl text-sm ${isMe ? 'bg-indigo-600 text-white ml-auto' : 'bg-slate-800 text-slate-200 mr-auto'}`;
            
            if (msg.content.startsWith('http') && (msg.content.endsWith('.png') || msg.content.endsWith('.jpg') || msg.content.endsWith('.jpeg') || msg.content.endsWith('.webp'))) {
                bubble.innerHTML = `<img src="${msg.content}" class="rounded-lg max-h-48 object-cover">`;
            } else {
                bubble.innerText = msg.content;
            }

            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content || !activeRecipient) return;
            input.value = '';

            await supabase.from('messages').insert({
                sender_id: currentUser.id,
                receiver_id: activeRecipient.id,
                content: content
            });
        }

        async function sendImage(e) {
            const file = e.target.files[0];
            if (!file || !activeRecipient) return;

            const filePath = `${currentUser.id}/${Date.now()}_${file.name}`;
            const { data, error } = await supabase.storage.from('chat-media').upload(filePath, file);

            if (error) {
                alert('Error uploading image: ' + error.message);
                return;
            }

            const { data: publicURLData } = supabase.storage.from('chat-media').getPublicUrl(filePath);
            const publicUrl = publicURLData.publicUrl;

            await supabase.from('messages').insert({
                sender_id: currentUser.id,
                receiver_id: activeRecipient.id,
                content: publicUrl
            });
        }

        function setupRealtimeSubscription() {
            if (messageSubscription) supabase.removeChannel(messageSubscription);

            messageSubscription = supabase
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    const newMsg = payload.new;
                    if (
                        (newMsg.sender_id === currentUser.id && newMsg.receiver_id === activeRecipient?.id) ||
                        (newMsg.sender_id === activeRecipient?.id && newMsg.receiver_id === currentUser.id)
                    ) {
                        appendMessageToDOM(newMsg);
                    }
                })
                .subscribe();
        }

        async function startVideoCall() {
            document.getElementById('video-container').classList.remove('hidden');
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                alert('Could not access camera/microphone: ' + err.message);
                endVideoCall();
            }
        }

        function endVideoCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('video-container').classList.add('hidden');
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        init();
    </script>
</body>
</html>
