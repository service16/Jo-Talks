<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jo-Talks - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center h-screen font-sans">

    <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 w-full max-w-md shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black tracking-tight text-indigo-400">Jo-Talks</h1>
            <p id="form-subtitle" class="text-xs text-slate-400 mt-1">Real-time professional communication platform</p>
        </div>

        <form id="auth-form" class="space-y-4">
            <div id="username-field" class="hidden space-y-1">
                <label class="text-xs font-semibold text-slate-400">Username</label>
                <input type="text" id="username" placeholder="johndoe" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>
            <div id="tag-field" class="hidden space-y-1">
                <label class="text-xs font-semibold text-slate-400">Tag</label>
                <input type="text" id="tag" placeholder="#0001" value="#0001" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-400">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-400">Password</label>
                <input type="password" id="password" placeholder="••••••••" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg text-sm font-semibold transition shadow-lg shadow-indigo-600/20 mt-2">Sign In</button>
        </form>

        <div class="text-center mt-6">
            <button onclick="toggleMode()" id="toggle-btn" class="text-xs text-indigo-400 hover:text-indigo-300 transition font-medium">Don't have an account? Create one</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vjmdwaaopgejmlxwckee.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_YE_zgqG5_HOKDon3egg1HQ_LTYd9...';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('form-subtitle').innerText = isSignUp ? 'Create your secure account' : 'Real-time professional communication platform';
            document.getElementById('submit-btn').innerText = isSignUp ? 'Create Account' : 'Sign In';
            document.getElementById('toggle-btn').innerText = isSignUp ? 'Already have an account? Sign in' : "Don't have an account? Create one";
            document.getElementById('username-field').classList.toggle('hidden', !isSignUp);
            document.getElementById('tag-field').classList.toggle('hidden', !isSignUp);
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;

            if (isSignUp) {
                const username = document.getElementById('username').value;
                const tag = document.getElementById('tag').value || '#0001';
                const { error } = await supabase.auth.signUp({
                    email, password,
                    options: { data: { username, tag } }
                });
                if (error) { alert(error.message); btn.disabled = false; }
                else {
                    alert('Account created successfully! You can now sign in.');
                    toggleMode();
                    btn.disabled = false;
                }
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) { alert(error.message); btn.disabled = false; }
                else window.location.href = 'chat.html';
            }
        });
    </script>
</body>
</html>
